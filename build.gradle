buildscript {
    // 1.9.10 (what termux-styling/termux-gui request upstream) still references Gradle's
    // Convention API, which Gradle 9 removed outright (NoClassDefFoundError: HasConvention).
    // Bumped to a Kotlin Gradle plugin version that doesn't touch it.
    ext.kotlin_version = '2.0.21'

    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.13.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.google.protobuf:protobuf-gradle-plugin:0.9.4" // required by termux-gui
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}
