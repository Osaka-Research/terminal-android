rootProject.name = "termux-clone"

include ':app', ':termux-shared', ':terminal-emulator', ':terminal-view'
project(':app').projectDir                 = new File(rootDir, 'termux-app/app')
project(':termux-shared').projectDir       = new File(rootDir, 'termux-app/termux-shared')
project(':terminal-emulator').projectDir   = new File(rootDir, 'termux-app/terminal-emulator')
project(':terminal-view').projectDir       = new File(rootDir, 'termux-app/terminal-view')

include ':api'
project(':api').projectDir = new File(rootDir, 'termux-api/app')

include ':boot'
project(':boot').projectDir = new File(rootDir, 'termux-boot/app')

include ':widget'
project(':widget').projectDir = new File(rootDir, 'termux-widget/app')

include ':float'
project(':float').projectDir = new File(rootDir, 'termux-float/app')

include ':styling'
project(':styling').projectDir = new File(rootDir, 'termux-styling/app')

include ':tasker'
project(':tasker').projectDir = new File(rootDir, 'termux-tasker/app')

include ':gui'
project(':gui').projectDir = new File(rootDir, 'termux-gui/app')

include ':hbuffers'
project(':hbuffers').projectDir = new File(rootDir, 'termux-gui/hbuffers')

// termux-x11 is built as its OWN separate APK ("com.termux.x11"), not merged into :app --
// its native-loading mechanism (shell-loader) structurally depends on being a separately
// installed, separately signed package, unlike the plugins above. Signed with the same shared
// debug key as everything else here, using its "sharedUid" flavor (android:sharedUserId=
// "com.termux"), so once both APKs are installed its MainActivity runs in :app's own process
// and TermuxX11Controller (in :app) can call it directly instead of only over IPC.
// Named ':lorie-app', not ':x11' -- shell-loader/build.gradle hardcodes the literal project
// path string "project(':lorie-app')" to read its signingConfig, so the module name has to
// match upstream's own naming exactly.
include ':lorie-app'
project(':lorie-app').projectDir = new File(rootDir, 'termux-x11/lorie-app')

include ':lorie'
project(':lorie').projectDir = new File(rootDir, 'termux-x11/lorie')

include ':shell-loader'
project(':shell-loader').projectDir = new File(rootDir, 'termux-x11/shell-loader')

include ':shell-loader:stub'
project(':shell-loader:stub').projectDir = new File(rootDir, 'termux-x11/shell-loader/stub')
